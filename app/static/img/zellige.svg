<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <g fill="none" stroke="#B8532D" stroke-width="1" opacity="0.09">
    <!-- centre eight-point star -->
    <rect x="34" y="34" width="28" height="28"/>
    <rect x="34" y="34" width="28" height="28" transform="rotate(45 48 48)"/>
    <circle cx="48" cy="48" r="6"/>
    <!-- corner stars (quartered across tiles) -->
    <g id="c">
      <rect x="-14" y="-14" width="28" height="28"/>
      <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)"/>
    </g>
    <use href="#c" x="96"/>
    <use href="#c" y="96"/>
    <use href="#c" x="96" y="96"/>
    <!-- connecting lattice -->
    <path d="M0 48h14M82 48h14M48 0v14M48 82v14"/>
  </g>
</svg>
